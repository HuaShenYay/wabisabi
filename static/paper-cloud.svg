<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200">
  <defs>
    <filter id="cloud" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0016" numOctaves="2" seed="21" result="cloudNoise"/>
      <feColorMatrix type="saturate" values="0" result="cloudDesat"/>
      <feComponentTransfer in="cloudDesat">
        <feFuncA type="linear" slope="0.015"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" filter="url(#cloud)"/>
</svg>
