<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Layer 1: fine grain noise -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" result="desaturated"/>
      <feComponentTransfer in="desaturated" result="fineGrain">
        <feFuncA type="linear" slope="0.16"/>
      </feComponentTransfer>
    </filter>

    <!-- Layer 2: paper fiber texture — longer, organic strands -->
    <filter id="fibers" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.018 0.12" numOctaves="2" seed="7" stitchTiles="stitch" result="fiberNoise"/>
      <feColorMatrix type="saturate" values="0" result="fiberDesat"/>
      <feComponentTransfer in="fiberDesat" result="fibers">
        <feFuncA type="linear" slope="0.09"/>
      </feComponentTransfer>
    </filter>

    <!-- Layer 3: subtle ink mottling — irregular darker patches -->
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="13" result="mottleNoise"/>
      <feColorMatrix type="saturate" values="0" result="mottleDesat"/>
      <feComponentTransfer in="mottleDesat" result="mottle">
        <feFuncA type="linear" slope="0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="100%" height="100%" filter="url(#grain)"/>
  <rect width="100%" height="100%" filter="url(#fibers)"/>
  <rect width="100%" height="100%" filter="url(#mottle)"/>
</svg>
